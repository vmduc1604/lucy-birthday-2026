<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Happy Birthday 🐧</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mali:wght@400;600&family=Dancing+Script:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #5a3a63;
        --paper: #fffaf0;
        --card: #fff;
        --bg: #1d1b4b;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --paper: #f6ecda;
          --card: #fff1f7;
        }
      }
      :root[data-theme="dark"] {
        --paper: #f6ecda;
        --card: #fff1f7;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: "Mali", "Baloo 2", sans-serif;
        color: var(--ink);
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      .bg {
        position: fixed;
        inset: 0;
        opacity: 0;
        transition: opacity 1.6s;
      }
      .bg0 {
        background: radial-gradient(circle at 50% 15%, #4d3b9e, #1d1b4b 72%);
      }
      .bg1 {
        background: linear-gradient(160deg, #ffd6e7, #ffe9c9 55%, #cfeaff);
      }
      .bg2 {
        background: linear-gradient(180deg, #d9c9ff, #ffd1e8);
      }
      .bg3 {
        background: linear-gradient(180deg, #fff1d9, #ffd9e6);
      }
      #fx {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
      }
      .f {
        position: absolute;
        left: var(--x);
        top: -10%;
        opacity: 0.8;
        color: #fff;
        animation: fall linear infinite;
      }
      .f.up {
        top: auto;
        bottom: -10%;
        animation-name: rise;
      }
      .scene {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        box-sizing: border-box;
        padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px
          calc(env(safe-area-inset-bottom, 0px) + 14px);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: scale(0.9);
        filter: blur(14px);
        transition:
          opacity 0.9s,
          transform 0.9s,
          filter 0.9s,
          visibility 0s 0.9s;
      }
      .scene.on {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: none;
        filter: none;
        transition:
          opacity 0.9s 0.3s,
          transform 0.9s 0.3s,
          filter 0.9s 0.3s;
      }
      .dark {
        color: #fff;
      }
      h1 {
        font:
          800 clamp(26px, 8vw, 46px)/1.3 "Baloo 2",
          cursive;
        color: #fff;
        text-shadow:
          0 0 18px #ff8fb8,
          0 3px 0 #c2467c;
        margin: 0;
        max-width: 94vw;
      }
      h2 {
        font:
          800 clamp(22px, 6vw, 32px)/1.3 "Baloo 2",
          cursive;
        margin: 0;
      }
      p {
        margin: 0;
        font-weight: 600;
        font-size: 17px;
      }
      .w {
        display: inline-block;
        white-space: nowrap;
      }
      .l {
        display: inline-block;
        opacity: 0;
        animation:
          pop 0.7s var(--d) both cubic-bezier(0.3, 1.6, 0.5, 1),
          bob 2s calc(var(--d) + 0.9s) ease-in-out infinite;
      }
      .btn {
        font:
          800 20px "Baloo 2",
          cursive;
        border: 0;
        border-radius: 99px;
        padding: 12px 28px;
        background: linear-gradient(#ff8fb8, #ff5d97);
        color: #fff;
        box-shadow:
          0 6px 0 #d63d78,
          0 14px 24px #ff5d9755;
        cursor: pointer;
        animation: pulse 1.8s infinite;
      }
      .btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #d63d78;
      }
      .hide {
        display: none !important;
      }
      .peng {
        width: 150px;
        cursor: pointer;
      }
      .peng.big {
        width: min(52vw, 210px);
      }
      .peng.sm {
        width: 86px;
      }
      .peng svg {
        width: 100%;
        height: auto;
        display: block;
        animation: bob 2.4s ease-in-out infinite;
        overflow: visible;
      }
      .peng.jump {
        animation: jump 0.6s;
      }
      .wr,
      .wl {
        transform-box: fill-box;
        transform-origin: 50% 8%;
      }
      .wr {
        animation: wave 1.1s ease-in-out infinite;
      }
      .wl {
        animation: wave 1.1s 0.5s ease-in-out infinite reverse;
      }
      .ey {
        transform-box: fill-box;
        transform-origin: center;
        animation: blink 4s infinite;
      }
      .say {
        position: fixed;
        z-index: 60;
        transform: translate(-50%, -100%);
        background: #fff;
        color: var(--ink);
        padding: 6px 12px;
        border-radius: 14px;
        font: 800 15px "Baloo 2";
        pointer-events: none;
        animation: say 1.4s both;
      }
      .cf {
        position: fixed;
        z-index: 50;
        pointer-events: none;
      }
      #snd {
        position: fixed;
        z-index: 70;
        right: 14px;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 0;
        background: #ffffffcc;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 4px 12px #0002;
      }
      #wipe {
        position: fixed;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          circle,
          #fff 0,
          #ffd1e8 55%,
          transparent 70%
        );
      }
      #gift {
        width: min(56vw, 230px);
        cursor: pointer;
      }
      #gift svg {
        width: 100%;
        overflow: visible;
        animation: bob 2s ease-in-out infinite;
      }
      #gift.shake svg {
        animation: shake 0.5s;
      }
      #lid {
        transition:
          transform 0.9s cubic-bezier(0.5, -0.4, 0.5, 1),
          opacity 0.9s;
      }
      #gift.open #lid {
        transform: translateY(-150px) rotate(-28deg);
        opacity: 0;
      }
      #prog {
        font-size: 26px;
        letter-spacing: 6px;
      }
      #cakeRow {
        display: flex;
        align-items: flex-end;
        gap: 6px;
      }
      #cake {
        width: min(46vw, 230px);
      }
      #cake svg {
        width: 100%;
        overflow: visible;
      }
      .fl {
        cursor: pointer;
        transform-box: fill-box;
        transform-origin: 50% 100%;
        filter: drop-shadow(0 0 8px #ffb84d);
        animation: flick 0.4s ease-in-out infinite alternate;
        transition:
          transform 0.4s,
          opacity 0.4s;
      }
      .fl.off {
        animation: none;
        transform: scale(0);
        opacity: 0;
      }
      .stack {
        display: grid;
        place-items: center;
        width: 100%;
      }
      #env,
      #paper {
        grid-area: 1/1;
      }
      #env {
        width: min(76vw, 320px);
        aspect-ratio: 1.5;
        background: #ffb3d1;
        border-radius: 12px;
        position: relative;
        box-shadow: 0 14px 30px #b0508050;
        cursor: pointer;
        animation: bob 2.4s ease-in-out infinite;
        transition:
          transform 0.8s,
          opacity 0.8s;
        perspective: 600px;
      }
      #env::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 12px;
        background:
          linear-gradient(135deg, #ff9fc4 50%, transparent 50%),
          linear-gradient(225deg, #ff9fc4 50%, transparent 50%);
        opacity: 0.7;
      }
      .flap {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 62%;
        background: #ff8fb8;
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        transform-origin: top;
        transition: transform 0.7s;
      }
      #env.open .flap {
        transform: rotateX(180deg);
      }
      #env.gone {
        opacity: 0;
        transform: translateY(50px) scale(0.8);
        pointer-events: none;
      }
      .seal {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -60%);
        font-size: 38px;
        transition: opacity 0.4s;
      }
      #env.open .seal {
        opacity: 0;
      }
      #paper {
        width: min(88vw, 420px);
        max-height: 60vh;
        overflow: auto;
        box-sizing: border-box;
        background: var(--paper)
          repeating-linear-gradient(transparent 0 33px, #f3c9d8 33px 34px);
        border-radius: 10px;
        padding: 18px 20px;
        text-align: left;
        box-shadow: 0 14px 30px #b0508050;
        opacity: 0;
        pointer-events: none;
        transform: translateY(60px) scale(0.92);
        transition: all 0.9s;
      }
      #paper.show {
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }
      #txt {
        font:
          600 21px/34px "Dancing Script",
          "Mali",
          cursive;
        white-space: pre-wrap;
        color: #7a3f5c;
      }
      #txt:not(.end)::after {
        content: "♡";
        animation: pulse 1s infinite;
      }
      #sig {
        font:
          600 24px/34px "Dancing Script",
          cursive;
        text-align: right;
        color: #d63d78;
        opacity: 0;
        transition: opacity 1.2s;
      }
      #gal {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        animation: in 0.9s both;
      }
      #wall {
        position: fixed;
        inset: -18%;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 3.5vw;
        padding: 0 4vw;
        box-sizing: border-box;
        overflow: hidden;
        opacity: 0;
        transform: rotate(-9deg);
        transition:
          opacity 1.6s,
          filter 1.6s;
        pointer-events: none;
      }
      #wall.on {
        opacity: 1;
      }
      #wall.soft {
        filter: blur(5px) saturate(1.15);
      }
      .col {
        flex: 1 1 0;
        max-width: 300px;
        animation: scroll var(--t) linear infinite;
        will-change: transform;
      }
      .pol {
        background: var(--card);
        padding: 8px 8px 26px;
        border-radius: 6px;
        margin-bottom: 3.5vw;
        box-shadow: 0 10px 24px #b0508055;
        transform: rotate(var(--r));
      }
      .ph {
        aspect-ratio: var(--a);
        border-radius: 3px;
        background: var(--g);
        display: grid;
        place-items: center;
        font-size: 44px;
        overflow: hidden;
      }
      .ph img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #veil {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.6s;
        background: linear-gradient(
          #ff8fb8aa,
          transparent 24%,
          transparent 70%,
          #ff8fb8dd
        );
      }
      #veil::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, #fff9, #ffd1e8c4 75%);
        opacity: 0;
        transition: opacity 1.6s;
      }
      #veil.on {
        opacity: 1;
      }
      #veil.wash::after {
        opacity: 1;
      }
      .glass {
        background: #ffffff66;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid #fffa;
        border-radius: 99px;
        padding: 8px 24px;
        box-shadow: 0 8px 30px #b0508040;
      }
      #s3 h2,
      #s3 p,
      #s4 p {
        text-shadow:
          0 0 12px #fff,
          0 0 4px #fff;
      }
      @keyframes scroll {
        to {
          transform: translateY(-50%);
        }
      }
      .duo {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 2px;
        margin-top: 28px;
      }
      .duo .peng {
        width: auto;
      }
      .duo.big .dk {
        width: min(40vw, 176px);
      }
      .duo.big .pg {
        width: min(35vw, 156px);
      }
      .duo.sm {
        margin-top: 18px;
      }
      .duo.sm .dk {
        width: min(22vw, 88px);
      }
      .duo.sm .pg {
        width: min(20vw, 78px);
      }
      .hrt {
        position: absolute;
        left: 50%;
        top: -30px;
        width: min(15vw, 62px);
        pointer-events: none;
        transform: translateX(-50%) rotate(8deg);
        animation: beat 1.4s ease-in-out infinite;
        filter: drop-shadow(0 4px 10px #ff7a6e88);
      }
      .duo.sm .hrt {
        width: 26px;
        top: -16px;
      }
      .hrt svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .dk svg {
        animation-delay: -1.1s;
      }
      #cakeRow .peng {
        width: min(19vw, 82px);
      }
      .sp {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: sway 2.6s ease-in-out infinite;
      }
      @keyframes beat {
        50% {
          transform: translateX(-50%) rotate(8deg) scale(1.18);
        }
      }
      @keyframes sway {
        50% {
          transform: rotate(9deg);
        }
      }
      @keyframes bob {
        50% {
          transform: translateY(-8px);
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.2) rotate(-20deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pulse {
        50% {
          transform: scale(1.07);
        }
      }
      @keyframes wave {
        50% {
          transform: rotate(-22deg);
        }
      }
      @keyframes blink {
        0%,
        92%,
        100% {
          transform: scaleY(1);
        }
        96% {
          transform: scaleY(0.1);
        }
      }
      @keyframes jump {
        40% {
          transform: translateY(-34px) scale(1.06, 0.96);
        }
      }
      @keyframes fall {
        to {
          transform: translateY(115vh) translateX(30px) rotate(360deg);
        }
      }
      @keyframes rise {
        to {
          transform: translateY(-115vh) translateX(-30px) rotate(40deg);
        }
      }
      @keyframes shake {
        20% {
          transform: rotate(-9deg) scale(1.05);
        }
        50% {
          transform: rotate(9deg);
        }
        80% {
          transform: rotate(-5deg);
        }
      }
      @keyframes flick {
        to {
          transform: scale(1.12, 0.92) rotate(3deg);
        }
      }
      @keyframes say {
        0% {
          opacity: 0;
          margin-top: 10px;
        }
        20%,
        75% {
          opacity: 1;
          margin-top: -8px;
        }
        100% {
          opacity: 0;
          margin-top: -30px;
        }
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.8);
        }
      }
    </style>
  </head>
  <body>
    <div class="bg bg0"></div>
    <div class="bg bg1"></div>
    <div class="bg bg2"></div>
    <div class="bg bg3"></div>
    <div id="wall"></div>
    <div id="veil"></div>
    <div id="fx"></div>
    <div id="wipe"></div>
    <button id="snd" aria-label="Nhạc">🔇</button>

    <section class="scene dark on" id="s0">
      <div class="duo big"></div>
      <h2>Có một điều bất ngờ<br />đang chờ Ly thúi đó…</h2>
      <button class="btn" id="start">Chạm để bắt đầu 💗</button>
    </section>

    <section class="scene dark" id="s1">
      <div class="duo big"></div>
      <h1 id="title"></h1>
      <p>(chạm vào hai bạn nhỏ thử xem 🐥🐧)</p>
      <button class="btn" data-go="2">Mở quà nào 🎁</button>
    </section>

    <section class="scene" id="s2">
      <div
        id="giftZone"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 14px;
        "
      >
        <h2>Em có một món quà nè!</h2>
        <p>Chạm vào hộp quà 3 lần nha 🎀</p>
        <div id="gift">
          <svg viewBox="0 0 200 200">
            <g id="lid">
              <rect
                x="20"
                y="62"
                width="160"
                height="40"
                rx="12"
                fill="#ff5d97"
              />
              <rect x="92" y="62" width="16" height="40" fill="#fff3a8" />
              <ellipse
                cx="78"
                cy="52"
                rx="20"
                ry="13"
                fill="#fff3a8"
                transform="rotate(-15 78 52)"
              />
              <ellipse
                cx="122"
                cy="52"
                rx="20"
                ry="13"
                fill="#fff3a8"
                transform="rotate(15 122 52)"
              />
              <circle cx="100" cy="56" r="9" fill="#ffd84d" />
            </g>
            <rect
              x="32"
              y="100"
              width="136"
              height="92"
              rx="12"
              fill="#ff8fb8"
            />
            <rect x="92" y="100" width="16" height="92" fill="#fff3a8" />
            <circle cx="68" cy="142" r="6" fill="#2b2340" />
            <circle cx="132" cy="142" r="6" fill="#2b2340" />
            <circle cx="66" cy="140" r="2" fill="#fff" />
            <circle cx="130" cy="140" r="2" fill="#fff" />
            <ellipse
              cx="54"
              cy="156"
              rx="9"
              ry="6"
              fill="#ff5d97"
              opacity=".5"
            />
            <ellipse
              cx="146"
              cy="156"
              rx="9"
              ry="6"
              fill="#ff5d97"
              opacity=".5"
            />
            <path
              d="M90 152q10 10 20 0"
              stroke="#2b2340"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <div id="prog">🤍🤍🤍</div>
      </div>
      <div id="gal" class="hide">
        <div class="glass">
          <h2>Chúc mừng em đã lớn thêm 1 tủiiiiii!!!!!!! 🌸</h2>
        </div>
        <button class="btn" data-go="3">Còn nữa nè →</button>
      </div>
    </section>

    <section class="scene" id="s3">
      <h2 id="wishT">Ước một điều ước nhé ✨</h2>
      <p id="wishP">Chạm vào từng ngọn nến để thổi tắt 🕯️</p>
      <div id="cakeRow">
        <div class="peng sm dk" id="d3"></div>
        <div id="cake">
          <svg viewBox="0 0 240 240">
            <ellipse
              cx="120"
              cy="216"
              rx="112"
              ry="14"
              fill="#fff"
              opacity=".8"
            />
            <rect
              x="28"
              y="150"
              width="184"
              height="64"
              rx="16"
              fill="#ffe3ee"
            />
            <rect
              x="28"
              y="150"
              width="184"
              height="24"
              rx="12"
              fill="#ff9ec7"
            />
            <g fill="#ff9ec7">
              <circle cx="52" cy="176" r="8" />
              <circle cx="100" cy="180" r="9" />
              <circle cx="150" cy="177" r="8" />
              <circle cx="190" cy="179" r="8" />
            </g>
            <rect
              x="58"
              y="100"
              width="124"
              height="52"
              rx="14"
              fill="#fff3d6"
            />
            <rect
              x="58"
              y="100"
              width="124"
              height="20"
              rx="10"
              fill="#ff8fb8"
            />
            <circle cx="84" cy="97" r="8" fill="#ff4d6d" />
            <circle cx="156" cy="97" r="8" fill="#ff4d6d" />
            <circle cx="120" cy="129" r="4" fill="#ffb3d1" />
            <g fill="#8fd3ff">
              <rect x="88" y="64" width="8" height="36" rx="3" />
              <rect x="116" y="64" width="8" height="36" rx="3" />
              <rect x="144" y="64" width="8" height="36" rx="3" />
            </g>
            <g class="fl">
              <circle cx="92" cy="50" r="22" fill="transparent" />
              <ellipse cx="92" cy="54" rx="7" ry="11" fill="#ffcf4d" />
              <ellipse cx="92" cy="57" rx="3.5" ry="6" fill="#fff6c4" />
            </g>
            <g class="fl">
              <circle cx="120" cy="50" r="22" fill="transparent" />
              <ellipse cx="120" cy="54" rx="7" ry="11" fill="#ffcf4d" />
              <ellipse cx="120" cy="57" rx="3.5" ry="6" fill="#fff6c4" />
            </g>
            <g class="fl">
              <circle cx="148" cy="50" r="22" fill="transparent" />
              <ellipse cx="148" cy="54" rx="7" ry="11" fill="#ffcf4d" />
              <ellipse cx="148" cy="57" rx="3.5" ry="6" fill="#fff6c4" />
            </g>
          </svg>
        </div>
        <div class="peng sm pg" id="p3"></div>
      </div>
      <button class="btn hide" id="toLetter" data-go="4">
        Có thư cho em nè 💌
      </button>
    </section>

    <section class="scene" id="s4">
      <div class="duo sm"></div>
      <div class="stack">
        <div id="env">
          <div class="flap"></div>
          <div class="seal">💗</div>
        </div>
        <div id="paper">
          <div id="txt"></div>
          <div id="sig"></div>
        </div>
      </div>
      <p id="envHint">Chạm vào phong thư để mở 💌</p>
      <button class="btn hide" id="again" data-go="1">Xem lại hông?</button>
    </section>

    <script src="lucy-images/images.js"></script>
    <script>
      /* ====== ✏️ CHỈNH Ở ĐÂY ====== */
      const TITLE =
        "Hôm nay là sinh nhật của cô gái đáng iu nhất thế giớiiiiiiiiiii";
      const IMG_DIR = "lucy-images"; /* thư mục chứa ảnh */
      const MUSIC_SRC =
        "music.mp3"; /* đặt file mp3 cạnh index.html. Chưa có file thì dùng nhạc hộp tự tạo */
      const LETTER = `Gửi Ly,

Ơ hôm nay là sinh nhật ai í nhợ ???
Là Ly đóooooooooooooooo!!!!!!!!!!!!!
Anh mong em tuổi mới luôn tràn ngập nhiều niềm vui và hạnh phúc, em phải khỏe nè, tươi nè, luôn xinh đẹp và tươi tắn như bông hoa đang nở íiii.
Nói em là hoa thì lại là so sánh khập khiễng, vẻ đẹp của hoa sớm nở rồi tàn, còn em luôn luôn là người con gái chinh chắn chu choe mà anh iu nhấc!

Cảm ơn em vì đã sinh ra, được gặp em lại còn yêu em quả là phúc mấy đời nhà anh :< 
Năm nay sinh nhật em mà anh không ở cạnh em được, anh biết là bọn mình đều buồn và nhớ nhau, nhưng mà cố gắng lên nha!!! để bọn mình trong tương lai được đồng hành cùng nhau trên mọi nẻo đường!
Chúc mừng sinh nhật, Ly thúi cụa anh 🐧💗`;
      const SIGN = "— Đức của em —";
      /* ============================ */

      const $ = (id) => document.getElementById(id);
      const DUCK = `<svg viewBox="0 0 200 220"><g class="bd"><ellipse cx="68" cy="208" rx="22" ry="8" fill="#f4b64f"/><ellipse cx="132" cy="208" rx="22" ry="8" fill="#f4b64f"/><g class="wl"><ellipse cx="26" cy="140" rx="12" ry="24" fill="#f8d383" stroke="#4a3f35" stroke-width="6" transform="rotate(18 26 140)"/></g><g class="wr"><ellipse cx="174" cy="140" rx="12" ry="24" fill="#f8d383" stroke="#4a3f35" stroke-width="6" transform="rotate(-18 174 140)"/></g><path d="M100 22C150 20 178 64 180 118 182 172 160 204 100 206 40 208 18 172 20 118 22 64 50 24 100 22Z" fill="#f8d383" stroke="#4a3f35" stroke-width="6" stroke-linejoin="round"/><path d="M64 92h16M120 92h16" stroke="#4a3f35" stroke-width="4.5" stroke-linecap="round"/><ellipse cx="56" cy="104" rx="9" ry="5.5" fill="#ffadb3" opacity=".85"/><ellipse cx="144" cy="104" rx="9" ry="5.5" fill="#ffadb3" opacity=".85"/><ellipse cx="100" cy="112" rx="34" ry="14" fill="#f7b733" stroke="#4a3f35" stroke-width="4.5"/></g></svg>`;
      const PENG = `<svg viewBox="0 -6 200 232"><g class="bd"><ellipse cx="68" cy="214" rx="24" ry="9" fill="#2f2a27"/><ellipse cx="134" cy="214" rx="24" ry="9" fill="#2f2a27"/><g class="wl"><ellipse cx="42" cy="164" rx="10" ry="22" fill="#c9c2bb" stroke="#35302c" stroke-width="6" transform="rotate(16 42 164)"/></g><g class="wr"><ellipse cx="158" cy="164" rx="10" ry="22" fill="#c9c2bb" stroke="#35302c" stroke-width="6" transform="rotate(-16 158 164)"/></g><ellipse cx="100" cy="164" rx="62" ry="52" fill="#c9c2bb" stroke="#35302c" stroke-width="6"/><path d="M78 156q4 6 10 10M122 156q-4 6-10 10" stroke="#35302c" stroke-width="3" fill="none" stroke-linecap="round"/><g class="sp"><path d="M100 46C96 36 94 28 100 22 106 16 114 20 110 27" stroke="#8b4a3c" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M112 24C118 8 138 4 152 10 144 26 126 30 112 24Z" fill="#6cc25a" stroke="#4b9a44" stroke-width="2"/><path d="M116 21Q132 14 147 11" stroke="#4b9a44" stroke-width="1.5" fill="none"/></g><ellipse cx="100" cy="92" rx="58" ry="52" fill="#3a332e"/><ellipse cx="100" cy="58" rx="30" ry="9" fill="#6d645e" opacity=".55"/><ellipse cx="76" cy="106" rx="27" ry="34" fill="#fbf5ee"/><ellipse cx="124" cy="106" rx="27" ry="34" fill="#fbf5ee"/><path d="M62 102q8-9 16 0M122 102q8-9 16 0" stroke="#3a332e" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="58" cy="116" rx="8" ry="5" fill="#ffadb3" opacity=".85"/><ellipse cx="142" cy="116" rx="8" ry="5" fill="#ffadb3" opacity=".85"/><ellipse cx="100" cy="112" rx="10" ry="8" fill="#4b423d"/><ellipse cx="97" cy="109" rx="3.5" ry="2.2" fill="#8a7e77"/></g></svg>`;
      const HEART = `<svg viewBox="0 0 100 90"><path d="M50 86C10 56 2 40 2 26 2 12 12 3 26 3c10 0 19 6 24 15C55 9 64 3 74 3c14 0 24 9 24 23 0 14-8 30-48 60z" fill="#ff7a6e"/></svg>`;
      document
        .querySelectorAll(".duo")
        .forEach(
          (d) =>
            (d.innerHTML =
              '<i class="hrt">' +
              HEART +
              '</i><div class="peng dk"></div><div class="peng pg"></div>'),
        );
      document
        .querySelectorAll(".peng")
        .forEach(
          (p) => (p.innerHTML = p.classList.contains("dk") ? DUCK : PENG),
        );

      /* confetti + sparkles */
      function conf(x, y, n = 40) {
        for (let i = 0; i < n; i++) {
          const e = document.createElement("i"),
            a = Math.random() * 6.28,
            d = 60 + Math.random() * (n > 20 ? 200 : 60),
            dx = Math.cos(a) * d,
            dy = Math.sin(a) * d - 60,
            r = Math.random() * 540 - 270;
          e.className = "cf";
          e.textContent = ["💗", "✨", "🎉", "🌸", "⭐", "🤍"][i % 6];
          e.style.cssText = `left:${x}px;top:${y}px;font-size:${12 + Math.random() * 16}px`;
          document.body.append(e);
          e.animate(
            [
              { transform: "translate(0,0) scale(.3)", opacity: 1 },
              {
                transform: `translate(${dx}px,${dy}px) rotate(${r}deg) scale(1)`,
                opacity: 1,
                offset: 0.55,
              },
              {
                transform: `translate(${dx * 1.1}px,${dy + 240}px) rotate(${r * 1.5}deg)`,
                opacity: 0,
              },
            ],
            {
              duration: 1500 + Math.random() * 900,
              easing: "cubic-bezier(.2,.8,.3,1)",
            },
          ).onfinish = () => e.remove();
        }
      }
      addEventListener("pointerdown", (e) => conf(e.clientX, e.clientY, 4));
      const mid = (el) => {
        const r = el.getBoundingClientRect();
        return [r.x + r.width / 2, r.y + r.height / 2];
      };
      function wipe() {
        $("wipe").animate(
          [
            { opacity: 0.9, transform: "scale(0)" },
            { opacity: 0.9, transform: "scale(1.6)", offset: 0.5 },
            { opacity: 0, transform: "scale(2.3)" },
          ],
          { duration: 1200 },
        );
      }

      /* ambient layer */
      function fx(n) {
        const f = $("fx");
        f.innerHTML = "";
        const E = [
          ["❄️", "✦", "✧", "❅"],
          ["🌸", "✨", "💗", "☁️"],
          ["✨", "🎈", "💖", "⭐"],
          ["💗", "🌷", "✨", "🤍"],
        ][n < 2 ? 0 : n - 1];
        for (let i = 0; i < 24; i++) {
          const s = document.createElement("span");
          s.className = "f" + (n > 1 ? " up" : "");
          s.textContent = E[i % 4];
          s.style.cssText = `--x:${Math.random() * 96}%;font-size:${10 + Math.random() * 18}px;animation-duration:${7 + Math.random() * 9}s;animation-delay:${-Math.random() * 12}s`;
          f.append(s);
        }
      }

      /* penguin tap */
      document.addEventListener("click", (e) => {
        const p = e.target.closest(".peng");
        if (!p) return;
        p.classList.remove("jump");
        void p.offsetWidth;
        p.classList.add("jump");
        const b = document.createElement("div"),
          r = p.getBoundingClientRect();
        b.className = "say";
        const DUCK_SAYS = [
            "Sinh nhật vui nha bbyyyy!",
            "Yêu Ly thúi nhấcccccc",
            "Em đánh rắm đấy à",
            "Anh là anh chỉ yêu mỗi mình em thôi, em là nhấc",
            "Anh nhớ em điên mất",
          ],
          PENG_SAYS = [
            "Hẹ hẹ hẹ 🥰",
            "Iu anh vịt nhất luôn 💛",
            "Cảm ơn anh nha 🥹",
            "Em cũng iu anh nhiều~",
            "Anh đánh rắm đấy à",
            "ĐỨC ƠI EM NHỚ ANH",
          ];
        const SAY = p.classList.contains("dk") ? DUCK_SAYS : PENG_SAYS;
        b.textContent = SAY[(Math.random() * SAY.length) | 0];
        b.style.cssText = `left:${r.x + r.width / 2}px;top:${r.y}px`;
        document.body.append(b);
        setTimeout(() => b.remove(), 2000);
      });

      /* scenes */
      const BGS = [0, 0, 1, 2, 3],
        bgs = document.querySelectorAll(".bg");
      let ty;
      function go(n) {
        wipe();
        document
          .querySelectorAll(".scene")
          .forEach((s, i) => s.classList.toggle("on", i == n));
        bgs.forEach((b, i) => (b.style.opacity = i == BGS[n] ? 1 : 0));
        setWall(n >= 3, n >= 3);
        fx(n);
        if (n == 1) split();
        if (n == 2) resetGift();
        if (n == 3) resetCake();
        if (n == 4) resetLetter();
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-go]");
        if (b) go(+b.dataset.go);
      });
      function split() {
        let k = 0;
        $("title").innerHTML = TITLE.split(" ")
          .map(
            (w) =>
              '<span class="w">' +
              [...w]
                .map(
                  (c) =>
                    `<span class="l" style="--d:${(k++ * 0.045).toFixed(2)}s">${c}</span>`,
                )
                .join("") +
              "</span>",
          )
          .join(" ");
      }

      /* scene 2: gift → photos */
      let gn = 0;
      function resetGift() {
        gn = 0;
        $("gift").classList.remove("open");
        $("prog").textContent = "🤍🤍🤍";
        $("giftZone").classList.remove("hide");
        $("gal").classList.add("hide");
      }
      $("gift").onclick = () => {
        if (gn >= 3) return;
        const g = $("gift");
        gn++;
        $("prog").textContent = "💗".repeat(gn) + "🤍".repeat(3 - gn);
        g.classList.remove("shake");
        void g.offsetWidth;
        g.classList.add("shake");
        conf(...mid(g), gn < 3 ? 8 : 60);
        if (gn == 3) {
          g.classList.add("open");
          setTimeout(() => {
            wipe();
            $("giftZone").classList.add("hide");
            $("gal").classList.remove("hide");
            buildWall().then(() => setWall(true, false));
            fx(2);
          }, 1100);
        }
      };
      /* scene 3: cake */
      let left = 3;
      function resetCake() {
        left = 3;
        document
          .querySelectorAll(".fl")
          .forEach((f) => f.classList.remove("off"));
        $("toLetter").classList.add("hide");
        $("wishT").textContent = "Ước một điều ước nhé ✨";
        $("wishP").textContent = "Chạm vào từng ngọn nến để thổi tắt 🕯️";
      }
      document.querySelectorAll(".fl").forEach(
        (f) =>
          (f.onclick = () => {
            if (f.classList.contains("off")) return;
            f.classList.add("off");
            conf(...mid(f), 6);
            if (--left == 0)
              setTimeout(() => {
                conf(innerWidth / 2, innerHeight / 2, 80);
                $("p3").click();
                setTimeout(() => $("d3").click(), 300);
                $("wishT").textContent = "Điều ước của em sẽ thành sự thật 🌟";
                $("wishP").textContent =
                  "Chúc mừng sinh nhật, công chúa cánh cụt!";
                $("toLetter").classList.remove("hide");
              }, 500);
          }),
      );

      /* scene 4: letter */
      function resetLetter() {
        clearInterval(ty);
        $("env").className = "";
        $("paper").classList.remove("show");
        $("txt").textContent = "";
        $("txt").classList.remove("end");
        $("sig").style.opacity = 0;
        $("sig").textContent = SIGN;
        $("again").classList.add("hide");
        $("envHint").classList.remove("hide");
      }
      $("env").onclick = () => {
        const e = $("env");
        if (e.classList.contains("open")) return;
        e.classList.add("open");
        $("envHint").classList.add("hide");
        conf(...mid(e), 20);
        setTimeout(() => {
          e.classList.add("gone");
          $("paper").classList.add("show");
          let i = 0;
          ty = setInterval(() => {
            $("txt").textContent = LETTER.slice(0, ++i);
            $("paper").scrollTop = 1e5;
            if (i >= LETTER.length) fin();
          }, 55);
        }, 900);
      };
      function fin() {
        clearInterval(ty);
        $("txt").textContent = LETTER;
        $("txt").classList.add("end");
        $("sig").style.opacity = 1;
        $("again").classList.remove("hide");
        conf(innerWidth / 2, innerHeight / 2, 70);
      }
      $("paper").onclick = () => {
        if (!$("txt").classList.contains("end")) fin();
      };

      /* music: music-box Happy Birthday, or your own file via MUSIC_SRC */
      let ac,
        out,
        au,
        muted = false,
        tm;
      const M = [
          [67, 0.75],
          [67, 0.25],
          [69, 1],
          [67, 1],
          [72, 1],
          [71, 2],
          [67, 0.75],
          [67, 0.25],
          [69, 1],
          [67, 1],
          [74, 1],
          [72, 2],
          [67, 0.75],
          [67, 0.25],
          [79, 1],
          [76, 1],
          [72, 1],
          [71, 1],
          [69, 2],
          [77, 0.75],
          [77, 0.25],
          [76, 1],
          [72, 1],
          [74, 1],
          [72, 2],
        ],
        CH = [
          [0, 6, [48, 52, 55]],
          [6, 6, [43, 47, 50]],
          [12, 7, [48, 52, 55]],
          [19, 4, [53, 57, 60]],
          [23, 2, [48, 52, 55]],
        ],
        BT = 0.6,
        hz = (m) => 440 * 2 ** ((m - 69) / 12);
      function tone(m, t, d, v, ty) {
        const o = ac.createOscillator(),
          g = ac.createGain();
        o.type = ty;
        o.frequency.value = hz(m);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(v, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g).connect(out);
        o.start(t);
        o.stop(t + d + 0.05);
      }
      function loop() {
        const t0 = ac.currentTime + 0.1;
        let t = t0;
        for (const [m, b] of M) {
          tone(m, t, 1.3, 0.17, "sine");
          tone(m + 12, t, 0.7, 0.05, "triangle");
          t += b * BT;
        }
        CH.forEach(([s, l, ns]) =>
          ns.forEach((n) => tone(n, t0 + s * BT, l * BT, 0.05, "sine")),
        );
        tm = setTimeout(loop, 27 * BT * 1000);
      }
      function synth() {
        if (ac) return;
        ac = new (window.AudioContext || window.webkitAudioContext)();
        out = ac.createGain();
        out.gain.value = muted ? 0 : 0.9;
        const dl = ac.createDelay(),
          fb = ac.createGain();
        dl.delayTime.value = 0.33;
        fb.gain.value = 0.3;
        out.connect(ac.destination);
        out.connect(dl);
        dl.connect(fb);
        fb.connect(dl);
        dl.connect(ac.destination);
        loop();
      }
      let started = false,
        heard = false,
        blobUrl = null;
      fetch(MUSIC_SRC)
        .then((r) => (r.ok ? r.blob() : Promise.reject()))
        .then((b) => {
          blobUrl = URL.createObjectURL(b);
        })
        .catch(
          () => {},
        ); /* tải sẵn cả file nhạc vào bộ nhớ để phát liền mạch, không bị tải lại giữa chừng */
      function music() {
        if (started) return;
        started = true;
        $("snd").textContent = "🔊";
        au = new Audio(blobUrl || MUSIC_SRC);
        au.loop = true;
        au.volume = 0.8;
        au.onplaying = () => {
          heard = true;
        };
        au.onerror = () => {
          if (!heard) {
            au = null;
            synth();
          }
        };
        au.play().catch(() => {
          if (!heard && !ac) {
            au = null;
            synth();
          }
        });
      }
      $("snd").onclick = () => {
        if (!started) return music();
        muted = !muted;
        if (au) au.muted = muted;
        if (out) out.gain.value = muted ? 0 : 0.9;
        $("snd").textContent = muted ? "🔇" : "🔊";
      };
      $("start").onclick = () => {
        music();
        go(1);
      };
      /* ảnh: lấy tất cả ảnh trong thư mục IMG_DIR */
      async function findImages() {
        if (window.LUCY_IMAGES && LUCY_IMAGES.length)
          return LUCY_IMAGES.map(
            (f) => IMG_DIR + "/" + encodeURIComponent(f),
          ); /* 1) images.js (chạy được mọi nơi) */
        try {
          const t = await (await fetch(IMG_DIR + "/")).text();
          const f = [
            ...t.matchAll(/href="([^"?#]+\.(?:jpe?g|png|webp|gif|avif))"/gi),
          ].map((m) => decodeURIComponent(m[1]).split("/").pop());
          if (f.length)
            return [...new Set(f)].map(
              (n) => IMG_DIR + "/" + encodeURIComponent(n),
            );
        } catch (e) {} /* 2) danh sách thư mục của server */
        const out = [];
        let miss = 0; /* 3) đặt tên 1.jpg, 2.jpg, 3.png ... */
        for (let i = 1; miss < 3 && i < 300; i++) {
          let ok = false;
          for (const x of ["jpg", "jpeg", "png", "webp"]) {
            const u = `${IMG_DIR}/${i}.${x}`;
            if (
              await new Promise((r) => {
                const m = new Image();
                m.onload = () => r(1);
                m.onerror = () => r(0);
                m.src = u;
              })
            ) {
              out.push(u);
              ok = true;
              break;
            }
          }
          miss = ok ? 0 : miss + 1;
        }
        return out;
      }
      function setWall(on, soft) {
        const w = $("wall"),
          v = $("veil");
        w.classList.toggle("on", on);
        w.classList.toggle("soft", soft);
        v.classList.toggle("on", on);
        v.classList.toggle("wash", soft);
      }
      async function buildWall() {
        const U = await imgsP,
          P = U.length ? U : Array(10).fill(null),
          cols = innerWidth < 640 ? 3 : 5,
          G = [
            "#ffd6e7,#ffb3d1",
            "#cfeaff,#d9c9ff",
            "#fff1c2,#ffd1b3",
            "#e3d6ff,#ffd1e8",
            "#d4f5e9,#cfeaff",
            "#ffe0ec,#fff1c2",
          ],
          E = ["🐧", "🌸", "🍓", "🧸", "☁️", "💗"],
          AR = ["1/1.2", "1/1", "1/1.35"];
        $("wall").innerHTML = Array.from({ length: cols }, (_, c) => {
          const n = Math.max(8, Math.ceil(P.length / cols)),
            L = Array.from(
              { length: n },
              (_, k) => P[(c + k * cols) % P.length],
            );
          return (
            `<div class="col" style="--t:${n * 5 + c * 4}s;animation-direction:${c % 2 ? "reverse" : "normal"};animation-delay:-${c * 3}s">` +
            [...L, ...L]
              .map((s, i) => {
                i %= n;
                return `<div class="pol" style="--r:${(((i * 7 + c * 3) % 7) - 3) * 0.9}deg"><div class="ph" style="--a:${AR[(i + c) % 3]};--g:linear-gradient(135deg,${G[(i + c) % 6]})">${s ? `<img src="${s}" alt="" decoding="async">` : E[(i + c) % 6]}</div></div>`;
              })
              .join("") +
            "</div>"
          );
        }).join("");
      }
      const imgsP = findImages();
      fx(0);
    </script>
  </body>
</html>
